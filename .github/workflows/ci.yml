name: C++ MLS tests
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev zlib1g-dev liblapacke-dev python3-numpy python3-scipy python3-matplotlib cmake g++
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish M3 experimental spectrum
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: m3-experimental-spectrum
          path: build/m3_ci/
          if-no-files-found: error
          retention-days: 30
      - name: M4 refinement and sensitivity campaign
        run: python3 scripts/m4_campaign.py --binary build/tm_validation --out build/m4_campaign --profile ci
      - name: Publish M4 validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-tm-validation
          path: build/m4_campaign/
          if-no-files-found: warn
          retention-days: 30
      - name: M4 high-refinement reference campaign (9x7, 13x11, 17x15)
        run: python3 scripts/m4_campaign.py --binary build/tm_validation --out build/m4_high --profile local --timeout 600
      - name: Publish high-refinement experimental data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-high-refinement
          path: build/m4_high/
          if-no-files-found: warn
          retention-days: 30
      - name: M6b invariant divergence and normal-flux subspaces
        run: python3 scripts/m6b_campaign.py --binary build/constraint_subspace --out build/m6b_diagnostics
      - name: Publish M6b diagnostic-only artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m6b-constraint-subspaces
          path: build/m6b_diagnostics/
          if-no-files-found: warn
          retention-days: 30
