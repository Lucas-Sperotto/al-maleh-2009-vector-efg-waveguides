name: C++ MLS tests
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev zlib1g-dev liblapacke-dev python3-numpy python3-scipy python3-matplotlib cmake g++
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish M3 experimental spectrum
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: m3-experimental-spectrum
          path: build/m3_ci/
          if-no-files-found: error
          retention-days: 30
      - name: M4 refinement and sensitivity campaign
        run: python3 scripts/m4_campaign.py --binary build/tm_validation --out build/m4_campaign --profile ci
      - name: Publish M4 validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-tm-validation
          path: build/m4_campaign/
          if-no-files-found: warn
          retention-days: 30
      - name: M4 high-refinement reference campaign (9x7, 13x11, 17x15)
        run: python3 scripts/m4_campaign.py --binary build/tm_validation --out build/m4_high --profile local --timeout 600
      - name: Publish high-refinement experimental data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-high-refinement
          path: build/m4_high/
          if-no-files-found: warn
          retention-days: 30
      - name: M6b invariant divergence and normal-flux subspaces
        run: python3 scripts/m6b_campaign.py --binary build/constraint_subspace --out build/m6b_diagnostics
      - name: Publish M6b diagnostic-only artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m6b-constraint-subspaces
          path: build/m6b_diagnostics/
          if-no-files-found: warn
          retention-days: 30
      - name: M6c independent scalar MLS-EFG reference (9x7,13x11,17x15)
        run: python3 scripts/m6c_scalar_campaign.py --binary build/scalar_efg_control --out build/m6c_scalar --timeout 600
      - name: Verify M6c exported constrained eigenvectors independently
        run: OPENBLAS_NUM_THREADS=1 python3 scripts/verify_scalar_control.py --campaign build/m6c_scalar
      - name: Publish M6c full scalar eigenspectra
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m6c-scalar-efg-control
          path: build/m6c_scalar/
          if-no-files-found: warn
          retention-days: 30
      - name: M6d full-spectrum Cartesian gradient L2 projection
        run: python3 scripts/m6d_gradient_campaign.py --binary build/gradient_kernel_audit --out build/m6d_gradient --timeout 600
      - name: Independently verify M6d matrix exports and M6a spectrum
        run: PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 python3 scripts/verify_m6d_gradient.py --campaign build/m6d_gradient
      - name: Publish M6d gradient subspaces and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m6d-gradient-kernel-audit
          path: build/m6d_gradient/
          if-no-files-found: warn
          retention-days: 30
      # M6e: pin the independent Nedelec/Whitney implementation exactly.
      - name: Checkout pinned independent FEM edge reference
        uses: actions/checkout@v6
        with:
          repository: Lucas-Sperotto/fem-eigen-em-2d3d-whitney
          ref: dc1d9545c1238554c2292aa0f64a3c1b883d4118
          path: edge-fem-reference
          filter: blob:none
          sparse-checkout: |
            CMakeLists.txt
            src
      - name: Install independent edge FEM dependencies
        run: sudo apt-get install -y libopenblas-dev liblapacke-dev
      - name: Configure independent edge FEM (unchanged source)
        run: cmake -S edge-fem-reference -B build-edge -DCMAKE_BUILD_TYPE=Release
      - name: Build independent Whitney edge_rect only
        run: cmake --build build-edge --target edge_rect --parallel 2
      - name: M6e original TM Whitney vs archived Cartesian EFG
        run: PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 python3 scripts/m6e_edge_compare.py --edge-binary build-edge/edge_rect --edge-source-dir edge-fem-reference --out build/m6e_edge --timeout 600
      - name: Independently verify native Whitney FEM TM S/T and complete eigenpairs
        run: PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 python3 scripts/verify_m6e_edge.py --campaign build/m6e_edge
      - name: Publish M6e full Whitney edge/EFG comparisons
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m6e-whitney-edge-comparison
          path: build/m6e_edge/
          if-no-files-found: warn
          retention-days: 30
      - name: M2 original Chapter 5 Al Maleh grids and Gauss quadrature
        run: PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 python3 scripts/m2_ch5_benchmark.py --binary build/tm_validation --out build/m2_ch5 --timeout 600
      - name: Publish M2 source-anchored original Table 2 and 3 comparison
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m2-al-maleh-2009-chapter5
          path: build/m2_ch5/
          if-no-files-found: warn
          retention-days: 30
